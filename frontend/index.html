<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de preguntes</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>

    <div id="seccio-login">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Nom d'usuari:</label><br>
            <input type="text" id="username" name="username" required><br>
            <label for="password">Contrasenya:</label><br>
            <input type="password" id="password" name="password" required><br>
            <br>
            <button type="submit">Iniciar Sessió</button>
        </form>
    </div>

    <div id="seccio-quiz" class="hidden">
        <div id="partida"></div>
        <br>
        <div id="marcador">Preguntes respostes: 0</div>
        <button id="boto-enviar" class="hidden">Enviar Resultats</button>
        <br><br>
    </div>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</body>
</html>
