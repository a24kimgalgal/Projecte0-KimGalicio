<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de preguntes</title>
</head>
<body>

    <div id="seccio-login">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Nom d'usuari:</label><br>
            <input type="text" id="username" name="username" required><br>
            <label for="password">Contrasenya:</label><br>
            <input type="password" id="password" name="password" required><br>
            <br>
            <button type="submit">Iniciar Sessió</button>
        </form>
    </div>

    <div id="seccio-quiz" class="hidden">
        <div id="partida"></div>
        <br>
        <div id="marcador">Preguntes respostes: 0</div>
        <button id="boto-enviar" class="hidden">Enviar Resultats</button>
        <br><br>
    </div>

    <script src="script.js"></script>
</body>

<style>
    body {
        font-family: sans-serif;
        text-align: center;
        margin-top: 50px;
    }

    #seccio-login, #seccio-quiz {
        border: 2px solid gray;
        border-radius: 10px;
        padding: 20px;
        width: 400px;
        margin: 0 auto;
    }

    input {
        margin-bottom: 15px;
        padding: 5px;
    }

    button {
        background-color: #4CAF50;
        border-radius: 5px;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
    }

    .hidden {
        display: none;
    }
</style>
</html>
