<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de preguntes</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>

<body>
    <header id="top-navbar" class="hidden">
        <div class="navbar-content">
            <span id="missatge-salutacio"></span>
            <button id="boto-esborrar-nom" class="btn-outline">Esborrar nom</button>
        </div>
    </header>

    <div class="main-container">
        <div id="seccio-login" class="card">
            <h2>Login</h2>
            <form id="login-form">
                <label for="username">Nom d'usuari:</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Correu electrònic:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit" class="btn-primary">Iniciar Sessió</button>
            </form>
        </div>

        <div id="seccio-salutacio" class="card hidden">
            <div class="botons-container">
                <button id="boto-començar-joc" class="btn-primary btn-large">Començar Joc</button>
            </div>
        </div>

        <div id="seccio-quiz" class="card hidden">
            <div id="progress-container" class="hidden">
                <div id="progress-bar"></div>
            </div>
            <div id="partida"></div>
            <div class="stats-container">
                <div id="comptador-temps">Temps: 0s</div>
                <div id="marcador">Preguntes respostes: 0</div>
            </div>
            <button id="boto-enviar" class="btn-success hidden">Enviar Resultats</button>
        </div>
    </div>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</body>

</html>
