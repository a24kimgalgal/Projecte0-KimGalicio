<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de preguntes</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>

<body>

    <div id="seccio-login">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Nom d'usuari:</label><br>
            <input type="text" id="username" name="username" required><br>
            <label for="email">Correu electrònic:</label><br>
            <input type="email" id="email" name="email" required><br>
            <br>
            <button type="submit">Iniciar Sessió</button>
        </form>
    </div>

    <div id="seccio-salutacio" class="hidden">
        <h2 id="missatge-salutacio"></h2>
        <div class="botons-container">
            <button id="boto-començar-joc">Començar Joc</button>
            <button id="boto-esborrar-nom" class="btn-danger">Esborrar nom</button>
        </div>
    </div>

    <div id="seccio-quiz" class="hidden">
        <div id="partida"></div>
        <br>
        <div id="comptador-temps">Temps: 0s</div>
        <div id="marcador">Preguntes respostes: 0</div>
        <button id="boto-enviar" class="hidden">Enviar Resultats</button>
        <br><br>
    </div>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</body>

</html>
