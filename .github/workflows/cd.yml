name: Deploy Servidor Hestia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del Backend
        working-directory: ./backend
        run: npm install

      - name: Ejecutar Tests
        working-directory: ./backend
        run: npm test

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/a24kimgalgal.daw.inspedralbes.cat/private/Projecte0-KimGalicio

            git fetch origin
            git reset --hard origin/main

            echo "DB_HOST_PROD=${{ secrets.DB_HOST_PROD }}" > backend/.env
            echo "DB_PORT_PROD=3306" >> backend/.env
            echo "DB_USER_PROD=${{ secrets.DB_USER_PROD }}" >> backend/.env
            echo "DB_PASSWORD_PROD=${{ secrets.DB_PASSWORD_PROD }}" >> backend/.env
            echo "DB_NAME_PROD=${{ secrets.DB_NAME_PROD }}" >> backend/.env
            
            chmod 600 backend/.env

            npm install --prefix backend --no-fund --no-audit

            screen -S quiz-app -X quit 2>/dev/null || true
            screen -S backend -X quit 2>/dev/null || true
            pkill -f 'node app.js' || true
            nohup bash -lc 'cd ~/web/a24kimgalgal.daw.inspedralbes.cat/private/Projecte0-KimGalicio/backend && echo "Arrancando migrate..." > debug.log && node migrate.js >> debug.log 2>&1 && echo "Arrancando app..." >> debug.log && node app.js >> debug.log 2>&1' </dev/null >/dev/null 2>&1 &