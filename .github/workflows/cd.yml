name: Deploy Servidor Hestia

on:
  push:
    branches:
      - main
  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }} 
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }} 
        script: |
          # 1. Navegar a la carpeta del proyecto (Ajusta TU_DOMINIO a la ruta real)
          cd web/a24kimgalgal.daw.inspedralbes.cat/private/Projecte0-KimGalicio
          
          # 2. Descargar los últimos cambios
          git fetch origin
          git reset --hard origin/main
          
          # 3. Crear archivo .env de producción usando el secreto
          echo "${{ secrets.ENV_PROD }}" > .env
          
          # 4. Levantar contenedores Docker para producción
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build